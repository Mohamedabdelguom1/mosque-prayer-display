<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مواقيت الصلاة</title>

    <link rel="preload" href="./fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./fonts/fonts.css" />

    <style>
      /* يمنع وميض الخلفية البيضاء قبل تحميل التطبيق */
      html, body { margin: 0; background: #0b1a24; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      عامل الخدمة يجعل الشاشة تُقلع بلا انترنت بعد اول زيارة ناجحة.
      يُبنى فقط في نسخة الانتاج، ونتجاهل فشله في التطوير او عبر file://
    -->
    <script>
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {
            /* لا شيء: الشاشة تعمل كاملة بلا عامل خدمة */
          });
        });
      }
    </script>
  </body>
</html>
